name: Text checks

on:
  pull_request:
    # `edited` re-runs these checks when a title or description changes. The
    # boot test lives in ci.yml, which does not listen for it.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: text-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history:
    name: Authorship, credit lines and names
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commits and pull request text
        # Values reach the script through the environment, never by being
        # pasted into the command, so text in a title or description cannot
        # run as shell code.
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD' }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh tools/check-history.sh
      - name: Check branch, commit and title names
        # Only pull requests are checked, so commits made before the
        # convention existed are left alone.
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: sh tools/check-names.sh
      - name: Check that title edits cannot start the boot test
        run: sh tools/check-workflows.sh
