name: CI

on:
  pull_request:
    # Not `edited`: a title or description change touches no code, and its
    # checks live in text.yml so they cannot replace or cancel this run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    name: Format, lint and boot test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Run all checks
        run: cargo xtask check
