[workspace]
resolver = "3"
members = ["acpi", "apic", "boot", "descriptors", "elf", "frames", "handoff", "kernel", "nvme", "paging", "pci", "xtask"]
# `boot` and `kernel` only build for their own targets, so plain `cargo build`
# covers the host tools and the libraries. Use `cargo xtask build` for the
# boot image and the kernel.
default-members = ["acpi", "apic", "descriptors", "elf", "frames", "handoff", "nvme", "paging", "pci", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
