[package]
name = "bismuth-kernel"
description = "Bismuth's kernel, built as an ELF file for the boot stage to load"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Part of this repository, not third-party packages: the hand-off reader,
# and the placement rules' constants for the hand-off window.
bismuth-elf = { path = "../elf" }
bismuth-handoff = { path = "../handoff" }

[features]
# Ask QEMU to exit once the kernel has printed its line, or panicked. Only
# the automated boot test turns this on; it must stay off for real hardware.
qemu-exit = []
# Panic as soon as the kernel starts, so the boot test can check the panic
# handler. Only the boot test turns this on, for a second kernel file.
panic-at-entry = []
