[package]
name = "bismuth-kernel"
description = "Bismuth's kernel, built as an ELF file for the boot stage to load"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Part of this repository, not third-party packages: the hand-off reader,
# the placement rules' constants for the hand-off window, and the encoder
# of the processor's tables.
bismuth-descriptors = { path = "../descriptors" }
bismuth-elf = { path = "../elf" }
bismuth-handoff = { path = "../handoff" }

[features]
# Ask QEMU to exit once the kernel has printed its line, or panicked. Only
# the automated boot test turns this on; it must stay off for real hardware.
qemu-exit = []
# Panic as soon as the kernel has loaded its tables and printed its `MEMORY`
# line, so the boot test can check the panic handler. Only the boot test turns this on, for a second kernel file.
panic-at-entry = []
# Make one deliberate fault once the kernel has loaded its tables and read
# the hand-off, so the boot test can check the kernel's own report of it (`kernel/src/deliberate.rs`).
# Only the boot test turns one on, each for a kernel file of its own.
fault-divide = []
fault-invalid-opcode = []
fault-write-read-only = []
fault-run-data = []
fault-guard-page = []
fault-stack-overflow = []
fault-last-vector = []
